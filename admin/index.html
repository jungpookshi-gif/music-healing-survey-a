<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>연구 관리자 · Survey A</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header><div class="top">
    <a href="../">Music Healing <b>Survey A</b></a>
    <nav id="languages" aria-label="Language">
      <button data-lang="vi" lang="vi">VI</button><button data-lang="ko" lang="ko" aria-pressed="true">한국어</button>
      <button data-lang="en" lang="en">EN</button><button data-lang="zh" lang="zh-Hans">中文</button>
      <button data-lang="mn" lang="mn">Монгол</button>
    </nav>
  </div></header>
  <main>
    <section class="card admin-login" id="login-panel" aria-labelledby="sign-in-title">
      <h1 id="sign-in-title">관리자 로그인</h1>
      <form id="login" method="post">
        <label for="key" id="key-label">관리자 비밀번호</label>
        <input type="password" id="key" autocomplete="current-password" required maxlength="256">
        <button type="submit" class="primary" id="online" disabled>로그인</button>
        <p id="login-status" role="status"></p>
      </form>
    </section>
    <section id="dashboard" aria-labelledby="title" hidden inert>
      <div class="dash-top">
        <p class="eyebrow" id="workspace"></p>
        <button type="button" id="sign-out"></button>
      </div>
      <h1 id="title" tabindex="-1"></h1>
      <p id="sub" class="subtitle"></p>
      <section class="card access">
        <h2 id="connect"></h2>
        <label class="file" for="csv" id="file-label"></label>
        <input type="file" id="csv" accept=".csv,text/csv">
        <p id="private"></p>
        <p role="status" id="status"></p>
      </section>
      <div class="dash-top"><h2 id="overall"></h2><button type="button" id="clear" hidden></button></div>
      <div class="kpis" id="kpis"></div>
      <p id="study-scope" class="study-scope"></p>
      <section id="genre-map" class="card dashboard-section genre-map" aria-labelledby="genre-map-title"></section>
      <section class="dashboard-section" aria-labelledby="charts-title">
        <h2 id="charts-title"></h2>
        <div class="chart-grid" id="charts"></div>
      </section>
      <section class="card dashboard-section" aria-labelledby="table-title">
        <h2 id="table-title"></h2>
        <div class="table-frame" tabindex="0">
          <table aria-labelledby="table-title">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <p class="meta table-note" id="table-note"></p>
      </section>
    </section>
  </main>
  <script src="../config.js?v=2-online"></script>
  <script type="module" src="dashboard.js?v=11"></script>
</body>
</html>
